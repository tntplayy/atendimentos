<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Painel de Atendimento</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React e ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel para React JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#090d16] text-slate-100 min-h-screen">
    <div id="root"></div>

    <!-- Script da Aplicação em React -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        // Configuração do Supabase com o endpoint de Auth explícito para evitar o Failed to fetch
        const SUPABASE_URL = 'https://dwprxkwqjfquigurchpx.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_eqmxa7hRSYUNfhi0CYiTXA_mWCiswes';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true,
                storage: window.localStorage
            },
            realtime: {
                params: {
                    eventsPerSecond: 10
                }
            }
        });

        function App() {
            const [user, setUser] = useState(null);
            const [email, setEmail] = useState('');
            const [senha, setSenha] = useState('');
            const [erroLogin, setErroLogin] = useState('');

            // Estados do Painel
            const [atendimentos, setAtendimentos] = useState([]);
            const [cliente, setCliente] = useState('');
            const [assunto, setAssunto] = useState('');
            const [status, setStatus] = useState('Pendente');
            const [observacoes, setObservacoes] = useState('');

            // Verificar sessão ativa do Supabase Auth ao carregar
            useEffect(() => {
                supabaseClient.auth.getSession().then(({ data: { session } }) => {
                    if (session) {
                        setUser(session.user);
                        carregarAtendimentos();
                    }
                });

                const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((_event, session) => {
                    setUser(session ? session.user : null);
                    if (session) {
                        carregarAtendimentos();
                    }
                });

                return () => subscription.unsubscribe();
            }, []);

            // Função de Login oficial do Supabase Auth
            const handleLogin = async (e) => {
                e.preventDefault();
                setErroLogin('');

                try {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email: email.trim(),
                        password: senha,
                    });

                    if (error) {
                        setErroLogin('Erro ao entrar: ' + error.message);
                    } else if (data && data.user) {
                        setUser(data.user);
                        carregarAtendimentos();
                    }
                } catch (err) {
                    setErroLogin('Erro de conexão com o servidor.');
                }
            };

            // Logout oficial
            const handleLogout = async () => {
                await supabaseClient.auth.signOut();
                setUser(null);
                setEmail('');
                setSenha('');
            };

            // Carregar Atendimentos do Supabase
            const carregarAtendimentos = async () => {
                const { data, error } = await supabaseClient
                    .from('atendimentos')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (!error && data) {
                    setAtendimentos(data);
                }
            };

            // Salvar Novo Atendimento
            const handleSubmitAtendimento = async (e) => {
                e.preventDefault();
                const { error } = await supabaseClient
                    .from('atendimentos')
                    .insert([{ cliente, assunto, status, observacoes }]);

                if (error) {
                    alert('Erro ao salvar: ' + error.message);
                } else {
                    setCliente('');
                    setAssunto('');
                    setStatus('Pendente');
                    setObservacoes('');
                    carregarAtendimentos();
                }
            };

            // TELA DE LOGIN
            if (!user) {
                return (
                    <div className="flex items-center justify-center min-h-screen p-4">
                        <div className="bg-[#121826] border border-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-sm">
                            <h1 className="text-2xl font-bold mb-6 text-center text-white">Login - Atendimento</h1>
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium mb-1 text-slate-300">E-mail</label>
                                    <input 
                                        type="email" 
                                        value={email} 
                                        onChange={(e) => setEmail(e.target.value)} 
                                        required 
                                        className="w-full px-3 py-2 bg-[#090d16] border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500" 
                                        placeholder="seu@email.com"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-1 text-slate-300">Senha</label>
                                    <input 
                                        type="password" 
                                        value={senha} 
                                        onChange={(e) => setSenha(e.target.value)} 
                                        required 
                                        className="w-full px-3 py-2 bg-[#090d16] border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500" 
                                        placeholder="Sua senha"
                                    />
                                </div>
                                {erroLogin && <p className="text-red-400 text-sm text-center">{erroLogin}</p>}
                                <button type="submit" className="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">Entrar</button>
                            </form>
                        </div>
                    </div>
                );
            }

            // PAINEL PRINCIPAL
            return (
                <div className="max-w-6xl mx-auto p-4 md:p-8">
                    <header className="flex justify-between items-center mb-8 bg-[#121826] border border-slate-800 p-4 rounded-xl shadow-md">
                        <div>
                            <h1 className="text-xl font-bold text-white">Registro de Atendimentos</h1>
                            <p className="text-xs text-slate-400">Logado como: {user.email}</p>
                        </div>
                        <button onClick={handleLogout} className="bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-red-700 transition">Sair</button>
                    </header>

                    {/* Formulário */}
                    <div className="bg-[#121826] border border-slate-800 p-6 rounded-xl shadow-md mb-8">
                        <h2 className="text-lg font-semibold mb-4 text-white">Novo Atendimento</h2>
                        <form onSubmit={handleSubmitAtendimento} className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <input 
                                type="text" 
                                placeholder="Nome do Cliente" 
                                value={cliente} 
                                onChange={(e) => setCliente(e.target.value)} 
                                required 
                                className="px-3 py-2 bg-[#090d16] border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500" 
                            />
                            <input 
                                type="text" 
                                placeholder="Assunto / Motivo" 
                                value={assunto} 
                                onChange={(e) => setAssunto(e.target.value)} 
                                required 
                                className="px-3 py-2 bg-[#090d16] border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500" 
                            />
                            <select 
                                value={status} 
                                onChange={(e) => setStatus(e.target.value)} 
                                className="px-3 py-2 bg-[#090d16] border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500"
                            >
                                <option value="Pendente">Pendente</option>
                                <option value="Em Andamento">Em Andamento</option>
                                <option value="Concluído">Concluído</option>
                            </select>
                            <textarea 
                                placeholder="Observações..." 
                                value={observacoes} 
                                onChange={(e) => setObservacoes(e.target.value)} 
                                className="md:col-span-3 px-3 py-2 bg-[#090d16] border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500"
                            ></textarea>
                            <button type="submit" className="md:col-span-3 bg-emerald-600 text-white py-2 rounded-lg font-semibold hover:bg-emerald-700 transition">Salvar Atendimento</button>
                        </form>
                    </div>

                    {/* Tabela de Registros */}
                    <div className="bg-[#121826] border border-slate-800 p-6 rounded-xl shadow-md overflow-x-auto">
                        <h2 className="text-lg font-semibold mb-4 text-white">Atendimentos Registrados</h2>
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="border-b border-slate-800 text-slate-400 text-sm">
                                    <th className="p-3">Data</th>
                                    <th className="p-3">Cliente</th>
                                    <th className="p-3">Assunto</th>
                                    <th className="p-3">Status</th>
                                    <th className="p-3">Observações</th>
                                </tr>
                            </thead>
                            <tbody>
                                {atendimentos.map((item) => (
                                    <tr key={item.id} className="border-b border-slate-800/50 hover:bg-slate-800/30 text-sm">
                                        <td className="p-3 text-slate-300">{new Date(item.created_at).toLocaleDateString('pt-BR')}</td>
                                        <td className="p-3 font-medium text-white">{item.cliente}</td>
                                        <td className="p-3 text-slate-300">{item.assunto}</td>
                                        <td className="p-3">
                                            <span className={`px-2 py-1 rounded text-xs font-semibold ${item.status === 'Concluído' ? 'bg-green-900/50 text-green-300 border border-green-700' : 'bg-amber-900/50 text-amber-300 border border-amber-700'}`}>
                                                {item.status}
                                            </span>
                                        </td>
                                        <td className="p-3 text-slate-400">{item.observacoes || '-'}</td>
                                    </tr>
                                ))}
                                {atendimentos.length === 0 && (
                                    <tr>
                                        <td colSpan="5" className="p-4 text-center text-slate-500">Nenhum atendimento registrado.</td>
                                    </tr>
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
